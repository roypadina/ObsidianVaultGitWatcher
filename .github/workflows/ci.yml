name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # dist: stripped, ad-hoc signed app + zip, the same artifact the Homebrew cask installs.
      - name: Build
        run: ./build.sh dist

      - name: Self-test
        run: build/ObsidianVaultGitWatcher.app/Contents/MacOS/ObsidianVaultGitWatcher --selftest

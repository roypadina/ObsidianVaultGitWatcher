name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a vault in Settings
        2. Edit a note and wait for the quiet period
        3. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.3"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and install method
      placeholder: "0.2.0, Homebrew"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The relevant lines from the log (Settings → General → Log → Open). Remove anything private first.
      render: text
